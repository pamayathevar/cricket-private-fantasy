[build]
  command = "npm run export:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.13.1"

# Expo Router/native-web navigation may request a path directly. Serve the
# application shell so the client can restore the requested screen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Deploys must not leave users pinned to an obsolete application shell.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Fingerprinted Expo assets are safe to cache indefinitely.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
